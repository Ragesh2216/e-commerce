<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found | NexusCommerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 text-center">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col pointer-events-none"></div>

  <!-- MAIN 404 CONTAINER (No Header, No Footer, Only Two Buttons: Back and Home) -->
  <main class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 sm:p-10 space-y-8 my-auto">
    
    <!-- Brand Logo Image -->
    <div class="flex justify-center">
      <img src="logo_0978.webp" alt="NexusStore Logo" class="h-12 sm:h-14 w-auto object-contain" />
    </div>

    <!-- 404 Visual Graphic & Badge -->
    <div class="relative inline-block my-2">
      <div class="text-7xl sm:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 tracking-widest select-none">
        404
      </div>
      <div class="mt-2 bg-blue-100 text-blue-700 text-[11px] font-bold px-3.5 py-1 rounded-full border border-blue-200 shadow-sm uppercase tracking-wider inline-block">
        Oops! Page Not Found
      </div>
    </div>

    <!-- Explanatory Text -->
    <div class="space-y-2">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Lost in Cyberspace?</h1>
      <p class="text-slate-500 text-xs sm:text-sm leading-relaxed">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
    </div>

    <!-- Only Two Buttons: Back & Home -->
    <div class="flex flex-col sm:flex-row gap-3 pt-2">
      <!-- Button 1: Back -->
      <button onclick="window.history.back()" class="w-full sm:w-1/2 inline-flex items-center justify-center px-5 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition transform hover:-translate-y-0.5">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Go Back
      </button>

      <!-- Button 2: Home -->
      <a href="index.html" class="w-full sm:w-1/2 inline-flex items-center justify-center px-5 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Home Page
      </a>
    </div>

  </main>

  <footer class="mt-8 text-xs text-slate-400">
    <p>&copy; 2026 NexusCommerce Inc. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
